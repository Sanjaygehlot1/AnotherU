[project]
name = "anotheru-graphiti"
version = "0.1.0"
description = "Graphiti temporal memory service for AnotherU"
requires-python = ">=3.10,<4"

dependencies = [
    "graphiti-core==0.30.2",
    "openai>=2.41,<3",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-dotenv>=1.0,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]